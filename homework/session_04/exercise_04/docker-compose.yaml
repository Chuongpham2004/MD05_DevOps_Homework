services:
  nginx_proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user_service
      - product_service
    networks:
      - storex-proxy-net

  user_service:
    image: storex-user:latest
    networks:
      - storex-proxy-net
      
  product_service:
    image: storex-product:latest
    networks:
      - storex-proxy-net

networks:
  storex-proxy-net:
    name: storex-proxy-net
    driver: bridge