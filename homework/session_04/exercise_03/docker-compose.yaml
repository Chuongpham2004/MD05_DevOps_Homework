services:
  backend:
    image: storex-backend:v3
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - storex-net

  postgres:
    image: postgres:13
    # Đã xóa hoàn toàn mục ports: - "5432:5432" để cô lập DB với máy host
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - storex-net

networks:
  storex-net:
    name: storex-net
    driver: bridge